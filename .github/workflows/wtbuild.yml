# Checks that wtbuild (tools/wtbuild, the Rust build) still writes exactly what the Python scripts it replaced write.
# Runs on stand-in programs built from tools/wtbuild/testdata (no game code): nothing of a dump is needed.
name: wtbuild

on:
  pull_request:
    paths: ['tools/wtbuild/**', 'lifter/**', 'scripts/**', 'runtime/gen/**', 'runtime/gen_static/**', 'tools/extract/**',
            '.github/workflows/wtbuild.yml']
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
          pip install lz4 Pillow

      - name: Build and unit tests
        run: |
          cargo build --release --locked --manifest-path tools/wtbuild/Cargo.toml
          cargo test --release --locked --manifest-path tools/wtbuild/Cargo.toml

      - name: Compare with the Python
        run: |
          python3 tools/wtbuild/compare_lifter.py 1000000 --seed 1
          python3 tools/wtbuild/compare_lift.py --functions 2500 --seed 1
          python3 tools/wtbuild/compare_tables.py
          python3 tools/wtbuild/compare_mods.py 300 --seed 1
          python3 tools/wtbuild/compare_text.py 20 --seed 1
